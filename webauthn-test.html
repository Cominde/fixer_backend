<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebAuthn Passkey Authentication Test</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 12px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        padding: 40px;
        max-width: 500px;
        width: 100%;
      }

      h1 {
        color: #333;
        margin-bottom: 10px;
        font-size: 28px;
        text-align: center;
      }

      .subtitle {
        color: #666;
        margin-bottom: 30px;
        text-align: center;
        font-size: 14px;
      }

      .section {
        margin-bottom: 30px;
        padding: 20px;
        border: 1px solid #e1e5e9;
        border-radius: 8px;
        background: #f8f9fa;
      }

      .section h2 {
        color: #444;
        margin-bottom: 15px;
        font-size: 18px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .step-number {
        background: #667eea;
        color: white;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: bold;
      }

      .form-group {
        margin-bottom: 15px;
      }

      label {
        display: block;
        margin-bottom: 5px;
        color: #555;
        font-weight: 500;
        font-size: 14px;
      }

      input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 14px;
        transition: border-color 0.3s;
      }

      input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      button {
        background: #667eea;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        width: 100%;
      }

      button:hover {
        background: #5a6fd8;
        transform: translateY(-1px);
      }

      button:disabled {
        background: #ccc;
        cursor: not-allowed;
        transform: none;
      }

      .result {
        margin-top: 15px;
        padding: 15px;
        border-radius: 6px;
        font-size: 14px;
        display: none;
      }

      .result.success {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }

      .result.error {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }

      .result.info {
        background: #d1ecf1;
        color: #0c5460;
        border: 1px solid #bee5eb;
      }

      .loading {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid #ffffff;
        border-radius: 50%;
        border-top-color: transparent;
        animation: spin 0.8s linear infinite;
        margin-right: 8px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .passkey-list {
        margin-top: 15px;
        max-height: 200px;
        overflow-y: auto;
      }

      .passkey-item {
        background: white;
        padding: 10px;
        border-radius: 4px;
        margin-bottom: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border: 1px solid #e1e5e9;
      }

      .passkey-info {
        flex: 1;
      }

      .passkey-label {
        font-weight: 600;
        color: #333;
      }

      .passkey-date {
        font-size: 12px;
        color: #666;
      }

      .revoke-btn {
        background: #dc3545;
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 4px;
        font-size: 12px;
        cursor: pointer;
      }

      .revoke-btn:hover {
        background: #c82333;
      }

      .divider {
        text-align: center;
        margin: 30px 0;
        color: #666;
        font-size: 14px;
      }

      .divider::before,
      .divider::after {
        content: "";
        height: 1px;
        background: #e1e5e9;
        display: block;
        position: absolute;
        width: 40%;
        top: 50%;
      }

      .divider::before {
        left: 0;
      }

      .divider::after {
        right: 0;
      }

      .divider {
        position: relative;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🔐 WebAuthn Passkey Test</h1>
      <p class="subtitle">
        Test secure passwordless authentication for your admin system
      </p>

      <!-- Step 1: Login with Password -->
      <div class="section">
        <h2>
          <span class="step-number">1</span>
          Login with Password
        </h2>
        <div class="form-group">
          <label for="email">Email:</label>
          <input
            type="email"
            id="email"
            placeholder="admin@example.com"
            value="admin@example.com"
          />
        </div>
        <div class="form-group">
          <label for="password">Password:</label>
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
          />
        </div>
        <button onclick="loginWithPassword()" id="loginBtn">
          Login with Password
        </button>
        <div id="loginResult" class="result"></div>
      </div>

      <div class="divider">or</div>

      <!-- Step 2: Passkey Login -->
      <div class="section">
        <h2>
          <span class="step-number">2</span>
          Login with Passkey
        </h2>
        <button onclick="beginPasskeyLogin()" id="passkeyLoginBtn">
          Login with Passkey
        </button>
        <div id="passkeyLoginResult" class="result"></div>
      </div>

      <!-- Step 3: Register Passkey (requires login) -->
      <div class="section">
        <h2>
          <span class="step-number">3</span>
          Register New Passkey
        </h2>
        <button onclick="beginPasskeyRegistration()" id="registerBtn" disabled>
          Register New Passkey
        </button>
        <div id="registerResult" class="result"></div>
      </div>

      <!-- Step 4: Manage Passkeys -->
      <div class="section">
        <h2>
          <span class="step-number">4</span>
          Manage Passkeys
        </h2>
        <button onclick="listPasskeys()" id="listBtn" disabled>
          List My Passkeys
        </button>
        <div id="passkeyList" class="passkey-list"></div>
        <div id="listResult" class="result"></div>
      </div>
    </div>

    <script>
      // Configuration
      const API_BASE = "http://localhost:4000/api/V2";
      let authToken = "";
      let currentUser = null;

      // Utility functions
      function showResult(elementId, message, type = "info") {
        const element = document.getElementById(elementId);
        element.className = `result ${type}`;
        element.textContent = message;
        element.style.display = "block";
      }

      function hideResult(elementId) {
        const element = document.getElementById(elementId);
        element.style.display = "none";
      }

      function setLoading(buttonId, loading = true) {
        const button = document.getElementById(buttonId);
        if (loading) {
          button.disabled = true;
          button.innerHTML = '<span class="loading"></span>Processing...';
        } else {
          button.disabled = false;
          button.innerHTML = button.innerHTML.replace(
            '<span class="loading"></span>Processing...',
            button.getAttribute("data-original-text") || "Submit",
          );
        }
      }

      function setButtonOriginalText(buttonId) {
        const button = document.getElementById(buttonId);
        if (!button.getAttribute("data-original-text")) {
          button.setAttribute("data-original-text", button.innerHTML);
        }
      }

      function enableAuthenticatedButtons() {
        document.getElementById("registerBtn").disabled = false;
        document.getElementById("listBtn").disabled = false;
      }

      function arrayBufferToBase64(buffer) {
        const bytes = new Uint8Array(buffer);
        let binary = "";
        for (let i = 0; i < bytes.byteLength; i++) {
          binary += String.fromCharCode(bytes[i]);
        }
        return btoa(binary);
      }

      function base64ToArrayBuffer(base64) {
        const binaryString = atob(base64);
        const bytes = new Uint8Array(binaryString.length);
        for (let i = 0; i < binaryString.length; i++) {
          bytes[i] = binaryString.charCodeAt(i);
        }
        return bytes.buffer;
      }

      function formatDate(dateString) {
        return (
          new Date(dateString).toLocaleDateString() +
          " " +
          new Date(dateString).toLocaleTimeString()
        );
      }

      // Step 1: Login with Password
      async function loginWithPassword() {
        setButtonOriginalText("loginBtn");
        setLoading("loginBtn", true);
        hideResult("loginResult");

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        if (!email || !password) {
          showResult(
            "loginResult",
            "Please enter both email and password",
            "error",
          );
          setLoading("loginBtn", false);
          return;
        }

        try {
          const response = await fetch(`${API_BASE}/auth/admin/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });

          const result = await response.json();

          if (response.ok && result.token) {
            authToken = result.token;
            currentUser = result.data.user;
            showResult(
              "loginResult",
              `✅ Login successful! Welcome ${currentUser.name}`,
              "success",
            );
            enableAuthenticatedButtons();

            // Auto-load passkeys
            setTimeout(listPasskeys, 1000);
          } else {
            showResult(
              "loginResult",
              `❌ Login failed: ${result.message || "Unknown error"}`,
              "error",
            );
          }
        } catch (error) {
          showResult(
            "loginResult",
            `❌ Network error: ${error.message}`,
            "error",
          );
        } finally {
          setLoading("loginBtn", false);
        }
      }

      // Step 2: Login with Passkey
      async function beginPasskeyLogin() {
        setButtonOriginalText("passkeyLoginBtn");
        setLoading("passkeyLoginBtn", true);
        hideResult("passkeyLoginResult");

        const email = document.getElementById("email").value;
        const origin = window.location.origin;

        if (!email) {
          showResult(
            "passkeyLoginResult",
            "Please enter your email first",
            "error",
          );
          setLoading("passkeyLoginBtn", false);
          return;
        }

        try {
          // Begin login
          const beginResponse = await fetch(
            `${API_BASE}/auth/admin/passkey/login/begin`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email, origin }),
            },
          );

          const beginResult = await beginResponse.json();

          if (!beginResponse.ok || beginResult.status !== "success") {
            throw new Error(beginResult.message || "Failed to begin login");
          }

          // Check if user has passkeys
          if (beginResult.data.allowCredentials.length === 0) {
            showResult(
              "passkeyLoginResult",
              "No passkeys found for this user. Please register a passkey first.",
              "info",
            );
            setLoading("passkeyLoginBtn", false);
            return;
          }

          showResult(
            "passkeyLoginResult",
            "🔑 Use your device to authenticate...",
            "info",
          );

          // Convert base64 challenge to Uint8Array for WebAuthn
          const webauthnData = {
            ...beginResult.data,
            challenge: base64ToArrayBuffer(beginResult.data.challenge),
          };

          // Get credential
          const credential = await navigator.credentials.get({
            publicKey: webauthnData,
          });

          // Finish login
          const finishResponse = await fetch(
            `${API_BASE}/auth/admin/passkey/login/finish`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                credential: {
                  id: credential.id,
                  response: {
                    authenticatorData: arrayBufferToBase64(
                      credential.response.authenticatorData,
                    ),
                    clientDataJSON: arrayBufferToBase64(
                      credential.response.clientDataJSON,
                    ),
                    signature: arrayBufferToBase64(
                      credential.response.signature,
                    ),
                  },
                  type: credential.type,
                },
                origin: origin,
                clientDataJSON: arrayBufferToBase64(
                  credential.response.clientDataJSON,
                ),
              }),
            },
          );

          const finishResult = await finishResponse.json();

          if (finishResponse.ok && finishResult.status === "success") {
            authToken = finishResult.token;
            currentUser = finishResult.data.user;
            showResult(
              "passkeyLoginResult",
              `✅ Passkey login successful! Welcome ${currentUser.name}`,
              "success",
            );
            enableAuthenticatedButtons();

            // Auto-load passkeys
            setTimeout(listPasskeys, 1000);
          } else {
            showResult(
              "passkeyLoginResult",
              `❌ Passkey login failed: ${finishResult.message || "Unknown error"}`,
              "error",
            );
          }
        } catch (error) {
          if (error.name === "NotAllowedError") {
            showResult(
              "passkeyLoginResult",
              "❌ Authentication cancelled by user",
              "error",
            );
          } else if (error.name === "NotSupportedError") {
            showResult(
              "passkeyLoginResult",
              "❌ WebAuthn not supported on this device/browser",
              "error",
            );
          } else {
            showResult(
              "passkeyLoginResult",
              `❌ Error: ${error.message}`,
              "error",
            );
          }
        } finally {
          setLoading("passkeyLoginBtn", false);
        }
      }

      // Step 3: Register Passkey
      async function beginPasskeyRegistration() {
        if (!authToken) {
          showResult("registerResult", "Please login first", "error");
          return;
        }

        setButtonOriginalText("registerBtn");
        setLoading("registerBtn", true);
        hideResult("registerResult");

        const origin = window.location.origin;

        try {
          // Begin registration
          const beginResponse = await fetch(
            `${API_BASE}/auth/admin/passkey/register/begin`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${authToken}`,
              },
              body: JSON.stringify({ origin }),
            },
          );

          const beginResult = await beginResponse.json();

          if (!beginResponse.ok || beginResult.status !== "success") {
            throw new Error(
              beginResult.message || "Failed to begin registration",
            );
          }

          if (beginResult.status === "success") {
            // Convert base64 challenge to Uint8Array for WebAuthn
            const webauthnData = {
              ...beginResult.data,
              challenge: base64ToArrayBuffer(beginResult.data.challenge),
            };

            showResult(
              "registerResult",
              "🔑 Follow your device prompts to create a passkey...",
              "info",
            );

            // Use real WebAuthn API
            const credential = await navigator.credentials.create({
              publicKey: webauthnData,
            });

            // Finish registration
            const finishResponse = await fetch(
              `${API_BASE}/auth/admin/passkey/register/finish`,
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  Authorization: `Bearer ${authToken}`,
                },
                body: JSON.stringify({
                  credential: {
                    id: credential.id,
                    rawId: arrayBufferToBase64(credential.rawId),
                    response: {
                      attestationObject: arrayBufferToBase64(
                        credential.response.attestationObject,
                      ),
                      clientDataJSON: credential.response.clientDataJSON,
                    },
                    type: credential.type,
                  },
                  origin: origin,
                }),
              },
            );

            const finishResult = await finishResponse.json();

            if (finishResponse.ok && finishResult.status === "success") {
              showResult(
                "registerResult",
                "✅ Passkey registered successfully! You can now use it to login.",
                "success",
              );

              // Auto-refresh passkey list
              setTimeout(listPasskeys, 1000);
            } else {
              showResult(
                "registerResult",
                `❌ Registration failed: ${finishResult.message || "Unknown error"}`,
                "error",
              );
            }
          }
        } catch (error) {
          if (error.name === "NotAllowedError") {
            showResult(
              "registerResult",
              "❌ Registration cancelled by user",
              "error",
            );
          } else if (error.name === "NotSupportedError") {
            showResult(
              "registerResult",
              "❌ WebAuthn not supported on this device/browser",
              "error",
            );
          } else {
            showResult("registerResult", `❌ Error: ${error.message}`, "error");
          }
        } finally {
          setLoading("registerBtn", false);
        }
      }

      // Step 4: List Passkeys
      async function listPasskeys() {
        if (!authToken) {
          showResult("listResult", "Please login first", "error");
          return;
        }

        setButtonOriginalText("listBtn");
        setLoading("listBtn", true);
        hideResult("listResult");

        try {
          const response = await fetch(`${API_BASE}/auth/admin/passkey/list`, {
            method: "GET",
            headers: {
              Authorization: `Bearer ${authToken}`,
            },
          });

          const result = await response.json();

          if (response.ok && result.status === "success") {
            const passkeys = result.data.passkeys;
            const passkeyList = document.getElementById("passkeyList");

            if (passkeys.length === 0) {
              passkeyList.innerHTML =
                '<p style="text-align: center; color: #666; padding: 20px;">No passkeys registered yet</p>';
            } else {
              passkeyList.innerHTML = passkeys
                .map(
                  (passkey) => `
                          <div class="passkey-item">
                              <div class="passkey-info">
                                  <div class="passkey-label">${passkey.label || "Unnamed Passkey"}</div>
                                  <div class="passkey-date">Created: ${formatDate(passkey.createdAt)}</div>
                                  ${passkey.lastUsedAt ? `<div class="passkey-date">Last used: ${formatDate(passkey.lastUsedAt)}</div>` : ""}
                              </div>
                              <button class="revoke-btn" onclick="revokePasskey('${passkey.credentialId}')">Revoke</button>
                          </div>
                      `,
                )
                .join("");
            }

            showResult(
              "listResult",
              `Found ${passkeys.length} passkey(s)`,
              "success",
            );
          } else {
            showResult(
              "listResult",
              `❌ Failed to list passkeys: ${result.message || "Unknown error"}`,
              "error",
            );
          }
        } catch (error) {
          showResult(
            "listResult",
            `❌ Network error: ${error.message}`,
            "error",
          );
        } finally {
          setLoading("listBtn", false);
        }
      }

      // Revoke Passkey
      async function revokePasskey(credentialId) {
        if (
          !confirm(
            "Are you sure you want to revoke this passkey? You will need to register it again to use it.",
          )
        ) {
          return;
        }

        try {
          const response = await fetch(
            `${API_BASE}/auth/admin/passkey/revoke`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${authToken}`,
              },
              body: JSON.stringify({ credentialId }),
            },
          );

          const result = await response.json();

          if (response.ok && result.status === "success") {
            showResult(
              "listResult",
              "✅ Passkey revoked successfully",
              "success",
            );
            setTimeout(listPasskeys, 1000); // Refresh list
          } else {
            showResult(
              "listResult",
              `❌ Failed to revoke passkey: ${result.message || "Unknown error"}`,
              "error",
            );
          }
        } catch (error) {
          showResult(
            "listResult",
            `❌ Network error: ${error.message}`,
            "error",
          );
        }
      }

      // Check WebAuthn support on page load
      window.addEventListener("load", () => {
        if (!window.navigator || !window.navigator.credentials) {
          showResult(
            "passkeyLoginResult",
            "⚠️ WebAuthn is not supported on this browser. Please use Chrome, Firefox, Edge, or Safari 14+",
            "info",
          );
          showResult(
            "registerResult",
            "⚠️ WebAuthn is not supported on this browser. Please use Chrome, Firefox, Edge, or Safari 14+",
            "info",
          );
        }
      });

      // Auto-focus email field
      document.getElementById("email").focus();
    </script>
  </body>
</html>
